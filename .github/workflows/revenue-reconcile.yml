name: Revenue reconciliation



# Checklist 196–199 — nightly dry-run; manual repair via workflow_dispatch.

on:

  schedule:

    - cron: "15 3 * * *"

  workflow_dispatch:

    inputs:

      repair:

        description: "Attempt safe repairs (--repair)"

        required: false

        default: "false"

        type: choice

        options:

          - "false"

          - "true"



jobs:

  reconcile:

    name: Payments vs entitlements vs ledger

    runs-on: ubuntu-latest



    env:

      DATABASE_URL: ${{ secrets.DATABASE_URL }}

      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}



    steps:

      - name: Require DATABASE_URL secret

        run: |

          if [ -z "$DATABASE_URL" ]; then

            echo "::error::DATABASE_URL secret is required for revenue reconcile (alert: revenue.reconcile_failed)."

            exit 1

          fi



      - uses: actions/checkout@v4



      - uses: actions/setup-node@v4

        with:

          node-version: "22"

          cache: npm



      - name: Install dependencies

        run: npm ci



      - name: Generate Prisma Client

        run: npx prisma generate



      - name: Run reconciliation

        run: |

          if [ "${{ github.event.inputs.repair || 'false' }}" = "true" ]; then

            npm run revenue:reconcile:repair

          else

            npm run revenue:reconcile

          fi

